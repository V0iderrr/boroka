<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Közös program?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f172a;
    --bg-glow-1: #7c3aed;
    --bg-glow-2: #2563eb;
    --surface: #1e293b;
    --surface-2: #26334a;
    --surface-3: #2f3f5c;
    --border: #334155;
    --border-soft: #2b394f;
    --text: #e5e9f2;
    --text-muted: #94a3b8;
    --text-faint: #64748b;
    --accent: #a78bfa;
    --accent-2: #60a5fa;
    --accent-ink: #0f172a;
    --danger: #f87171;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --font-head: "Space Grotesk", "Inter", sans-serif;
    --font-body: "Inter", sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 28px 18px;
    position: relative;
    overflow-x: hidden;
  }

  /* ambient glow — the one deliberate flourish */
  body::before, body::after{
    content: "";
    position: fixed;
    width: 46vmax;
    height: 46vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.22;
    z-index: 0;
    pointer-events: none;
    animation: drift 16s ease-in-out infinite alternate;
  }
  body::before{
    background: var(--bg-glow-1);
    top: -18vmax;
    left: -14vmax;
  }
  body::after{
    background: var(--bg-glow-2);
    bottom: -20vmax;
    right: -16vmax;
    animation-delay: -8s;
  }

  @keyframes drift{
    from{ transform: translate(0,0) scale(1); }
    to{ transform: translate(4%, 3%) scale(1.08); }
  }

  .stage{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 38px 30px 30px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
  }

  .card::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }

  .panel{ display: none; }
  .panel.visible{
    display: block;
    animation: rise 0.5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  h1{
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 1.7rem;
    line-height: 1.25;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .subtitle{
    color: var(--text-muted);
    font-size: 0.98rem;
    line-height: 1.55;
    margin: 0 0 26px;
  }

  .hint{
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 13px 15px;
    margin-bottom: 22px;
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .hint .dot{
    flex: none;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-2);
    margin-top: 7px;
  }

  label.field-label{
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  input[type="text"], input[type="password"], textarea{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 1rem;
    outline: none;
    transition: border-color .18s ease, background .18s ease;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus{
    border-color: var(--accent);
    background: var(--surface-3);
  }
  input::placeholder, textarea::placeholder{ color: var(--text-faint); }

  textarea{ resize: vertical; min-height: 78px; line-height: 1.5; }

  .pw-row{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 6px;
  }

  .shake{ animation: shake .38s ease; }
  @keyframes shake{
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  .error-msg{
    color: var(--danger);
    font-size: 0.88rem;
    min-height: 18px;
    margin: 10px 2px 0;
    font-weight: 500;
  }

  .btn{
    appearance: none;
    border: none;
    cursor: pointer;
    width: 100%;
    padding: 15px 18px;
    border-radius: var(--radius-md);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.02rem;
    color: var(--accent-ink);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
    box-shadow: 0 12px 28px -12px rgba(96,165,250,0.45);
  }
  .btn:hover{ filter: brightness(1.06); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0px) scale(0.99); }
  .btn:focus-visible{ outline: 2px solid var(--accent-2); outline-offset: 3px; }
  .btn:disabled{ opacity: 0.7; cursor: default; transform: none; }

  fieldset{
    border: none;
    padding: 0;
    margin: 0 0 22px;
  }
  legend{
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 10px;
    padding: 0;
  }

  .chip-group{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip-input{
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  .chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: all .16s ease;
    white-space: nowrap;
  }
  .chip:hover{ border-color: var(--accent); color: var(--text); }
  .chip-input:checked + .chip{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 8px 18px -8px rgba(167,139,250,0.55);
  }
  .chip-input:focus-visible + .chip{
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
  }

  .field-block{ margin-bottom: 22px; }

  .summary-box{
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    padding: 18px 18px 16px;
    margin: 4px 0 4px;
  }
  .summary-row{
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .summary-row:last-child{ border-bottom: none; }
  .summary-row .k{
    font-size: 0.78rem;
    color: var(--text-faint);
    font-weight: 500;
  }
  .summary-row .v{
    font-size: 0.99rem;
    color: var(--text);
    line-height: 1.5;
  }

  .confirm-note{
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 18px 0 4px;
    line-height: 1.5;
  }

  .contact-block{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    justify-content: flex-end;
  }
  .contact-pill{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 15px;
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.6;
    text-align: right;
  }
  .contact-pill a{
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .contact-pill a:hover{ color: var(--accent-2); }

  @media (max-width: 420px){
    .card{ padding: 30px 20px 24px; border-radius: 18px; }
    h1{ font-size: 1.45rem; }
    .contact-block{ justify-content: center; }
    .contact-pill{ text-align: center; width: 100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  .sound-toggle{
    position: fixed;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 1.15rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    padding: 0;
    transition: border-color .16s ease, transform .16s ease, background .16s ease;
    box-shadow: 0 10px 24px -14px rgba(0,0,0,0.65);
  }
  .sound-toggle:hover{ border-color: var(--accent); background: var(--surface-3); }
  .sound-toggle:active{ transform: scale(0.94); }
  .sound-toggle:focus-visible{ outline: 2px solid var(--accent-2); outline-offset: 3px; }
</style>
</head>
<body>

<audio id="bgMusic" src="zene.mp3" loop preload="auto"></audio>
<button type="button" id="soundToggle" class="sound-toggle" aria-label="Zene némítása vagy lejátszása" aria-pressed="false" title="Zene ki/be">🔇</button>

<div class="stage">
  <div class="card">

    <!-- SCREEN 1 — PASSWORD -->
    <section class="panel visible" id="screen-login">
      <h1>⚠️ Szigorúan bizalmas🤫! ⚠️</h1>
      <div class="hint">
        <span class="dot"></span>
        <span>Koffeintartalmú ital amit nem komálsz</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="pw-row">
          <label class="field-label" for="pwInput">Jelszó</label>
          <input type="password" id="pwInput" name="password" placeholder="Jelszó..." autocomplete="off">
        </div>
        <p class="error-msg" id="pwError" aria-live="polite"></p>
        <button type="submit" class="btn">Belépés</button>
      </form>
    </section>

    <!-- SCREEN 2 — INVITE -->
    <section class="panel" id="screen-invite">
      <h1>Same shit like before m'lady? ☕🍔🎞️</h1>
      <p class="subtitle"></p>

      <form id="inviteForm" novalidate>

        <input type="hidden" name="access_key" value="82b6a5ea-cec1-45c0-a122-553bdbaa1f15">
        <input type="hidden" name="subject" value="Új válasz érkezett a meghívóra! 🎉">
        <input type="hidden" name="from_name" value="Meghívó oldal">

        <fieldset id="dateFieldset">
          <legend>Melyik nap/napok?</legend>
          <div class="chip-group">
            <input class="chip-input" type="radio" name="Idopont" id="d1" value="Szept 25">
            <label class="chip" for="d1">Szept 25</label>

            <input class="chip-input" type="radio" name="Idopont" id="d2" value="Szept 26">
            <label class="chip" for="d2">Szept 26</label>

            <input class="chip-input" type="radio" name="Idopont" id="d3" value="Szept 27">
            <label class="chip" for="d3">Szept 27</label>

            <input class="chip-input" type="radio" name="Idopont" id="d4" value="Szept 25-26">
            <label class="chip" for="d4">Szept 25-26</label>

            <input class="chip-input" type="radio" name="Idopont" id="d5" value="Szept 26-27">
            <label class="chip" for="d5">Szept 26-27</label>

            <input class="chip-input" type="radio" name="Idopont" id="d6" value="Szept 25-27">
            <label class="chip" for="d6">Szept 25-27</label>

            <input class="chip-input" type="radio" name="Idopont" id="d7" value="Más">
            <label class="chip" for="d7">Más</label>
          </div>
          <p class="error-msg" id="dateError" aria-live="polite"></p>
        </fieldset>

        <fieldset>
          <legend>Mit csinálnánk?</legend>
          <div class="chip-group">
            <input class="chip-input" type="checkbox" name="Programok" id="p1" value="Corso">
            <label class="chip" for="p1">Kaj+trinken</label>

            <input class="chip-input" type="checkbox" name="Programok" id="p2" value="Barangolás">
            <label class="chip" for="p2">Barangolás</label>

            <input class="chip-input" type="checkbox" name="Programok" id="p3" value="Gondolkodós progi (társas)">
            <label class="chip" for="p3">Movie night</label>

            <input class="chip-input" type="checkbox" name="Programok" id="p4" value="Aktív progi">
            <label class="chip" for="p4">Aktív progi</label>
          </div>
        </fieldset>

        <div class="field-block">
          <label class="field-label" for="noteInput">Megjegyzés / Egyéb ötlet</label>
          <textarea id="noteInput" name="Megjegyzes" placeholder="Írj ide bármit, ami eszedbe jut…"></textarea>
        </div>

        <button type="submit" class="btn" id="submitBtn">Mehet! 👉</button>
        <p class="error-msg" id="formError" aria-live="polite"></p>
      </form>
    </section>

    <!-- SCREEN 3 — CONFIRMATION -->
    <section class="panel" id="screen-confirm">
      <h1>Good girl 👍</h1>
      <p class="confirm-note">Elküldve! 5p és írok, ha nem akkor írj majd vagy hívj.😉😆</p>

      <div class="summary-box">
        <div class="summary-row">
          <span class="k">Időpont</span>
          <span class="v" id="sumDate">—</span>
        </div>
        <div class="summary-row">
          <span class="k">Program</span>
          <span class="v" id="sumPrograms">—</span>
        </div>
        <div class="summary-row">
          <span class="k">Megjegyzés</span>
          <span class="v" id="sumNote">—</span>
        </div>
      </div>

      <div class="contact-block">
        <div class="contact-pill">
          <a href="mailto:gergobodnar754@gmail.com">gergobodnar754@gmail.com</a><br>
          <a href="tel:+36309686577">06309686577</a>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
  (function(){
    const screens = {
      login: document.getElementById('screen-login'),
      invite: document.getElementById('screen-invite'),
      confirm: document.getElementById('screen-confirm')
    };

    function showScreen(name){
      Object.values(screens).forEach(s => s.classList.remove('visible'));
      screens[name].classList.add('visible');
    }

    function normalize(str){
      return str
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
    }

    // --- Háttérzene / mute gomb ---
    const bgMusic = document.getElementById('bgMusic');
    const soundToggle = document.getElementById('soundToggle');

    function updateSoundIcon(){
      const playing = !bgMusic.paused;
      soundToggle.textContent = playing ? '🔊' : '🔇';
      soundToggle.setAttribute('aria-pressed', playing ? 'true' : 'false');
    }
    bgMusic.addEventListener('play', updateSoundIcon);
    bgMusic.addEventListener('pause', updateSoundIcon);

    soundToggle.addEventListener('click', function(){
      if(bgMusic.paused){
        bgMusic.play().catch(function(){ /* böngésző letiltotta, semmi gond */ });
      } else {
        bgMusic.pause();
      }
    });

    // --- Login ---
    const loginForm = document.getElementById('loginForm');
    const pwInput = document.getElementById('pwInput');
    const pwError = document.getElementById('pwError');
    const pwRow = document.querySelector('.pw-row');

    loginForm.addEventListener('submit', function(e){
      e.preventDefault();
      const val = normalize(pwInput.value);
      if(val === 'kave'){
        pwError.textContent = '';
        showScreen('invite');
        bgMusic.play().catch(function(){ /* böngésző letiltotta, semmi gond */ });
      } else {
        pwError.textContent = 'Helytelen jelszó, próbáld újra!';
        pwRow.classList.remove('shake');
        void pwRow.offsetWidth; // restart animation
        pwRow.classList.add('shake');
        pwInput.value = '';
        pwInput.focus();
      }
    });

    // --- Invite / Web3Forms submit ---
    const inviteForm = document.getElementById('inviteForm');
    const dateFieldset = document.getElementById('dateFieldset');
    const dateError = document.getElementById('dateError');
    const formError = document.getElementById('formError');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnDefaultText = submitBtn.textContent;

    inviteForm.addEventListener('submit', async function(e){
      e.preventDefault();

      const dateChecked = inviteForm.querySelector('input[name="Idopont"]:checked');
      if(!dateChecked){
        dateError.textContent = 'Válassz egy időpontot, hogy tudjam, mikor jó! 🙂';
        dateFieldset.classList.remove('shake');
        void dateFieldset.offsetWidth;
        dateFieldset.classList.add('shake');
        return;
      }
      dateError.textContent = '';
      formError.textContent = '';

      const programs = Array.from(inviteForm.querySelectorAll('input[name="Programok"]:checked'))
        .map(el => el.value);
      const note = document.getElementById('noteInput').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Küldés...';

      try {
        const formData = new FormData(inviteForm);
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: formData
        });
        const result = await response.json();

        if(result.success){
          document.getElementById('sumDate').textContent = dateChecked.value;
          document.getElementById('sumPrograms').textContent = programs.length ? programs.join(', ') : '—';
          document.getElementById('sumNote').textContent = note ? note : '—';
          showScreen('confirm');
        } else {
          formError.textContent = 'Hoppá, nem sikerült elküldeni. Próbáld meg újra! 🙈';
        }
      } catch(err){
        formError.textContent = 'Nincs internetkapcsolat, vagy hiba történt. Próbáld meg újra!';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = submitBtnDefaultText;
      }
    });
  })();
</script>

</body>
</html>
